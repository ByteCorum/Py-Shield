name: Linux tests

on:
  push:
    branches: [ stable, WIP ]
  pull_request:
    branches: [ stable, WIP ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Executable
      working-directory: scr
      run: |
        chmod +x build-linux.sh
        ./build-linux.sh
    - name: Archive Executable
      uses: actions/upload-artifact@v4
      with:
        name: .pyguard-linux
        path: scr/.pyguard

  obfuscation-multifile-linux:
    needs: ["build"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Executable
      uses: actions/download-artifact@v4
      with:
        name: .pyguard-linux
        path: "examples"

    - name: Preparation For Tests
      working-directory: examples
      run: |
        mv .pyguard multifile/
        chmod +x multifile/.pyguard
        rm -rf multifile/obfuscated

    - name: Obfuscation
      working-directory: examples/multifile
      run: |
        ./.pyguard obfuscate --aes --hashdata --fernet --chacha --salsa --base64 --recursive 4 --follow-imports --no-input --files lib.py main.py

    - name: Testing
      working-directory: examples/multifile/obfuscated
      run: |
        OUTPUT=$(python main.py)
        echo "Output: "
        echo "$OUTPUT"

        echo "Result: "
        if [ "$OUTPUT" = "hello world" ]; then
          echo "Success: main.py output contains 'hello world'"
        else
          echo "Failure: main.py output does not contain 'hello world'"
          exit 1
        fi

  obfuscation-onefile-linux:
